<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Apps Script Web App Integration</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    .form-container { max-width: 400px; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
    input, button { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; }
    button { background-color: #007bff; color: white; border: none; cursor: pointer; }
    button:hover { background-color: #0056b3; }
    #responseMessage { margin-top: 15px; font-weight: bold; }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>Submit Data</h2>
    <form id="apiForm">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>

      <button type="submit" id="submitBtn">Send Data</button>
    </form>
    <div id="responseMessage"></div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwj2oH7PfrN88leuotAamG4c0-0PluTlo9GG2Rm8QAf0mNs9zIsrDxo9rNcvK0on4qVkQ/exec";

    document.getElementById('apiForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const submitBtn = document.getElementById('submitBtn');
      const responseMsg = document.getElementById('responseMessage');

      submitBtn.disabled = true;
      responseMsg.innerText = "Submitting...";

      // Collect form data
      const formData = new FormData(this);

      // Send POST request using no-cors mode to prevent Google Apps Script CORS restrictions
      fetch(WEB_APP_URL, {
        method: "POST",
        mode: "no-cors", 
        body: formData
      })
      .then(() => {
        responseMsg.style.color = "green";
        responseMsg.innerText = "Data submitted successfully!";
        document.getElementById('apiForm').reset();
      })
      .catch(error => {
        responseMsg.style.color = "red";
        responseMsg.innerText = "Error: " + error.message;
      })
      .finally(() => {
        submitBtn.disabled = false;
      });
    });
  </script>

</body>
</html>
